[package]
name = "dev-fuzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Fuzzing harness integration for Rust. Wraps cargo-fuzz. Findings emitted as machine-readable reports. Part of the dev-* verification suite."

keywords = [
    "fuzz",
    "fuzzing",
    "libfuzzer",
    "verification",
    "ai-tools"
]

categories = [
    "development-tools",
    "development-tools::testing",
    "development-tools::debugging"
]

documentation = "https://docs.rs/dev-fuzz"
repository = "https://github.com/jamesgober/dev-fuzz"
homepage = "https://github.com/jamesgober/dev-fuzz"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dev-report = { version = "0.9", path = "../dev-report" }

[dev-dependencies]

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
